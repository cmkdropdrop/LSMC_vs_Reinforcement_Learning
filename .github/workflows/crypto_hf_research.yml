name: crypto-hf-cross-sectional-research

on:
  push:
    branches:
      - chatgpt/high-frequency-strategy-20260827
    paths:
      - experiments/crypto_hf/**
      - .github/workflows/crypto_hf_research.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: crypto-hf-research-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deterministic research environment
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.3 matplotlib==3.9.2
      - name: Compile research modules
        run: python -m py_compile experiments/crypto_hf/data.py experiments/crypto_hf/strategy.py experiments/crypto_hf/research.py
      - name: Run walk-forward search and untouched holdout
        run: python experiments/crypto_hf/research.py
      - name: Record environment and output inventory
        run: |
          python -m pip freeze > outputs/crypto_hf/python_environment.txt
          find outputs/crypto_hf -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          cat outputs/crypto_hf/selected_strategy.json
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-hf-research-results
          path: outputs/crypto_hf
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
