name: crypto-hf-v2-development

on:
  push:
    branches:
      - chatgpt/high-frequency-strategy-v2-20260827
    paths:
      - experiments/crypto_hf_v2/**
      - .github/workflows/crypto_hf_v2_develop.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: crypto-hf-v2-develop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deterministic environment
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.3
      - name: Reassemble, verify, and compile research runner
        run: |
          cat experiments/crypto_hf_v2/chunks/run_research.py.gz.b64.part* > /tmp/run_research.py.gz.b64
          echo "41128d2d4d54f24f98287a472b1bf03144c4cca827f892d130dc2236cdda9442  /tmp/run_research.py.gz.b64" | sha256sum -c -
          base64 -d /tmp/run_research.py.gz.b64 | gzip -d > experiments/crypto_hf_v2/run_research.py
          echo "640e2714c4a32db0ced1b304daac25ae0cecd4d6c087c754a66675728e4cd3ae  experiments/crypto_hf_v2/run_research.py" | sha256sum -c -
          python -m py_compile experiments/crypto_hf_v2/run_research.py
      - name: Run development walk-forward search
        run: python experiments/crypto_hf_v2/run_research.py --phase develop
      - name: Record outputs
        run: |
          python -m pip freeze > outputs/crypto_hf_v2/develop/python_environment.txt
          cat outputs/crypto_hf_v2/develop/frozen_config.json
          cat outputs/crypto_hf_v2/develop/selected_fold_results.csv
          head -21 outputs/crypto_hf_v2/develop/configuration_ranking.csv
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-hf-v2-development
          path: outputs/crypto_hf_v2/develop
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
