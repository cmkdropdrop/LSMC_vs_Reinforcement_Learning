name: inspect-crypto-optstop-source

on:
  push:
    branches:
      - chatgpt/crypto-optstop-hpo-20260827
    paths:
      - .github/workflows/inspect_crypto_optstop_source.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect HPO-relevant source
        run: |
          base64 --decode experiments/crypto_optstop/run_experiment.py.gz.b64 | gzip -d > /tmp/run_experiment.py
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('/tmp/run_experiment.py').read_text()
          tree = ast.parse(src)
          wanted = {
              'Config', 'QNetwork', 'train_model', 'select_margin',
              'run_backtest', 'command_develop', 'make_episode_set',
              'calculate_metrics', 'save_bundle'
          }
          for node in tree.body:
              name = getattr(node, 'name', None)
              if name in wanted:
                  print(f'===== {name} =====')
                  print(ast.get_source_segment(src, node))
          PY
