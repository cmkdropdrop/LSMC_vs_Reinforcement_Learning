name: inspect-crypto-optstop-source

on:
  push:
    branches:
      - chatgpt/crypto-optstop-hpo-20260827
    paths:
      - .github/workflows/inspect_crypto_optstop_source.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect top-level source structure
        run: |
          base64 --decode experiments/crypto_optstop/run_experiment.py.gz.b64 | gzip -d > /tmp/run_experiment.py
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('/tmp/run_experiment.py').read_text()
          tree = ast.parse(src)
          for node in tree.body:
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  names = [t.id for t in targets if isinstance(t, ast.Name)]
                  if names:
                      segment = ast.get_source_segment(src, node)
                      print('ASSIGN', ','.join(names), '::', segment[:500].replace('\n',' '))
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  print(type(node).__name__.upper(), node.name)
          PY
