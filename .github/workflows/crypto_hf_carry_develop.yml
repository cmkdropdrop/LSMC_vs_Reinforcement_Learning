name: crypto-hf-carry-development

on:
  push:
    branches:
      - chatgpt/high-frequency-strategy-v2-20260827
    paths:
      - experiments/crypto_hf_carry/**
      - .github/workflows/crypto_hf_carry_develop.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: crypto-hf-carry-develop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deterministic environment
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.3
      - name: Decode, verify, and apply the recorded development patch
        run: |
          echo "bc8d731bd463d9b7e5f1600bbc93174627829309a6949a2c5e1ed1dfb20b3690  experiments/crypto_hf_carry/run_carry.py.gz.b64" | sha256sum -c -
          base64 -d experiments/crypto_hf_carry/run_carry.py.gz.b64 | gzip -d > experiments/crypto_hf_carry/run_carry.py
          echo "4dee4c1b6f9ce2de6a98966b789285ac541353824a9d40541d1ff062817bdd4c  experiments/crypto_hf_carry/run_carry.py" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          path = Path("experiments/crypto_hf_carry/run_carry.py")
          source = path.read_text(encoding="utf-8")
          changes = {
              '[1, 3, 6], [6, 9, 12], [8, 10], [0., .5, 1.], [20, 28], [0., 10., 20.], ["equal", "edge"]':
                  '[1, 3, 6], [6, 9, 12], [8, 10, 12], [0., 1.], [20, 28], [0., 10., 20.], ["edge"]',
              'freq="8h"':
                  'freq="4h"',
              'valid = frow.gt(0) & score.notna() & vrow.notna() & lrow.notna()':
                  'valid = frow.notna() & score.notna() & vrow.notna() & lrow.notna()',
              'allocation = config.target_gross / config.hold_events':
                  'allocation = config.target_gross / (config.hold_events * 2.0)',
              'math.sqrt(365 * 3)':
                  'math.sqrt(365 * 6)',
              'pd.Series(config.top_k * 2, index=em)':
                  'pd.Series(config.top_k, index=em)',
              '"round_trip_trades": float(len(f) * config.top_k * 2)':
                  '"round_trip_trades": float(len(f) * config.top_k)',
              'completed leg round trips':
                  'completed delta-neutral pair round trips',
              'ff = pd.DataFrame(rows); rank = summarize(ff); eligible = rank[rank.complete_folds & rank.frequency_constraint_met]\n    if eligible.empty: raise RuntimeError("No configuration met frequency constraint")':
                  'ff = pd.DataFrame(rows); rank = summarize(ff)\n    ff.to_csv(output / "fold_results.csv", index=False); rank.to_csv(output / "configuration_ranking.csv", index=False)\n    eligible = rank[rank.complete_folds & rank.frequency_constraint_met]\n    if eligible.empty:\n        print("No eligible configuration. Diagnostic ranking:\\n", rank.head(30).to_string(index=False))\n        raise RuntimeError("No configuration met frequency constraint")',
              'ff.to_csv(output / "fold_results.csv", index=False); rank.to_csv(output / "configuration_ranking.csv", index=False)\n    selected =':
                  'selected =',
          }
          for old, new in changes.items():
              if old not in source:
                  raise SystemExit(f"Expected source fragment not found: {old}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY
          sha256sum experiments/crypto_hf_carry/run_carry.py
          python -m py_compile experiments/crypto_hf_carry/run_carry.py
      - name: Run development walk-forward search
        id: research
        continue-on-error: true
        run: python experiments/crypto_hf_carry/run_carry.py --phase develop
      - name: Record outputs
        if: always()
        run: |
          mkdir -p outputs/crypto_hf_carry/develop
          python -m pip freeze > outputs/crypto_hf_carry/develop/python_environment.txt
          find outputs/crypto_hf_carry/develop -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          test ! -f outputs/crypto_hf_carry/develop/frozen_config.json || cat outputs/crypto_hf_carry/develop/frozen_config.json
          test ! -f outputs/crypto_hf_carry/develop/selected_fold_results.csv || cat outputs/crypto_hf_carry/develop/selected_fold_results.csv
          test ! -f outputs/crypto_hf_carry/develop/configuration_ranking.csv || head -31 outputs/crypto_hf_carry/develop/configuration_ranking.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-hf-carry-development
          path: outputs/crypto_hf_carry/develop
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Enforce research success
        if: steps.research.outcome != 'success'
        run: exit 1
