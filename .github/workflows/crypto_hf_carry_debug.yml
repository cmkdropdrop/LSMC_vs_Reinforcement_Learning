name: crypto-hf-carry-source-diagnostics

on:
  push:
    branches:
      - chatgpt/high-frequency-strategy-v2-20260827
    paths:
      - .github/workflows/crypto_hf_carry_debug.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect relevant strategy sections
        run: |
          base64 -d experiments/crypto_hf_carry/run_carry.py.gz.b64 | gzip -d > /tmp/run_carry.py
          python -m py_compile /tmp/run_carry.py
          echo '=== FEATURE / PLAN LOGIC ==='
          sed -n '330,440p' /tmp/run_carry.py
          echo '=== GRID / SELECTION / EVALUATION ==='
          sed -n '440,525p' /tmp/run_carry.py
