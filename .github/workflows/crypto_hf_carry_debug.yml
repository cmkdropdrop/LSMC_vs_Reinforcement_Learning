name: crypto-hf-carry-source-diagnostics

on:
  push:
    branches:
      - chatgpt/high-frequency-strategy-v2-20260827
    paths:
      - .github/workflows/crypto_hf_carry_debug.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect detailed evaluator
        run: |
          base64 -d experiments/crypto_hf_carry/evaluate_detailed.py.gz.b64 | gzip -d > /tmp/evaluate_detailed.py
          python -m py_compile /tmp/evaluate_detailed.py
          echo '=== DETAILED EVALUATOR TOP ==='
          sed -n '1,180p' /tmp/evaluate_detailed.py
          echo '=== DETAILED EVALUATOR REMAINDER ==='
          sed -n '180,420p' /tmp/evaluate_detailed.py
