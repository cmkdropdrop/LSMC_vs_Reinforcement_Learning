name: crypto-hf-carry-source-diagnostics

on:
  push:
    branches:
      - chatgpt/high-frequency-strategy-v2-20260827
    paths:
      - .github/workflows/crypto_hf_carry_debug.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect relevant strategy sections
        run: |
          base64 -d experiments/crypto_hf_carry/run_carry.py.gz.b64 | gzip -d > /tmp/run_carry.py
          python -m py_compile /tmp/run_carry.py
          echo '=== CONSTANTS / UNIVERSE ==='
          sed -n '1,140p' /tmp/run_carry.py
          echo '=== GRID / FREQUENCY / SELECTION ==='
          grep -n -E 'def grid|product\(|top_k|minimum_monthly|eligible|frequency|pair round|round_trip_trades|month' /tmp/run_carry.py
          echo '=== DEVELOPMENT FUNCTION ==='
          sed -n '430,510p' /tmp/run_carry.py
