name: crypto-hf-carry-fresh-evaluation

on:
  push:
    branches:
      - chatgpt/high-frequency-strategy-v2-20260827
    paths:
      - experiments/crypto_hf_carry/frozen_config.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: crypto-hf-carry-fresh-evaluation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deterministic environment
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.3
      - name: Decode and patch the frozen strategy implementation
        run: |
          echo "bc8d731bd463d9b7e5f1600bbc93174627829309a6949a2c5e1ed1dfb20b3690  experiments/crypto_hf_carry/run_carry.py.gz.b64" | sha256sum -c -
          base64 -d experiments/crypto_hf_carry/run_carry.py.gz.b64 | gzip -d > experiments/crypto_hf_carry/run_carry.py
          base64 -d experiments/crypto_hf_carry/evaluate_detailed.py.gz.b64 | gzip -d > experiments/crypto_hf_carry/evaluate_detailed.py
          python - <<'PY'
          from pathlib import Path

          runner = Path("experiments/crypto_hf_carry/run_carry.py")
          source = runner.read_text(encoding="utf-8")
          changes = {
              'freq="8h"': 'freq="4h"',
              'valid = frow.gt(0) & score.notna() & vrow.notna() & lrow.notna()':
                  'valid = frow.notna() & score.notna() & vrow.notna() & lrow.notna()',
              'allocation = config.target_gross / config.hold_events':
                  'allocation = config.target_gross / (config.hold_events * 2.0)',
              'math.sqrt(365 * 3)': 'math.sqrt(365 * 6)',
              'pd.Series(config.top_k * 2, index=em)': 'pd.Series(config.top_k, index=em)',
              '"round_trip_trades": float(len(f) * config.top_k * 2)':
                  '"round_trip_trades": float(len(f) * config.top_k)',
              'completed leg round trips': 'completed delta-neutral pair round trips',
          }
          for old, new in changes.items():
              if old not in source:
                  raise SystemExit(f"Expected runner fragment not found: {old}")
              source = source.replace(old, new)
          runner.write_text(source, encoding="utf-8")

          evaluator = Path("experiments/crypto_hf_carry/evaluate_detailed.py")
          detail = evaluator.read_text(encoding="utf-8")
          old = 'allocated_gross = current_equity * config.target_gross / config.hold_events'
          new = 'allocated_gross = current_equity * config.target_gross / (config.hold_events * 2.0)'
          if old not in detail:
              raise SystemExit("Expected detailed-evaluator allocation fragment not found")
          evaluator.write_text(detail.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile experiments/crypto_hf_carry/run_carry.py experiments/crypto_hf_carry/evaluate_detailed.py
          sha256sum experiments/crypto_hf_carry/run_carry.py experiments/crypto_hf_carry/evaluate_detailed.py experiments/crypto_hf_carry/frozen_config.json
      - name: Execute the untouched August evaluation once
        run: |
          cd experiments/crypto_hf_carry
          python evaluate_detailed.py --frozen-config frozen_config.json
      - name: Record output inventory and result
        run: |
          python -m pip freeze > outputs/crypto_hf_carry/evaluate_detailed/python_environment.txt
          find outputs/crypto_hf_carry/evaluate_detailed -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          cat outputs/crypto_hf_carry/evaluate_detailed/evaluation_result.json
          cat outputs/crypto_hf_carry/evaluate_detailed/monthly.csv
          cat outputs/crypto_hf_carry/evaluate_detailed/cost_sensitivity.csv
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-hf-carry-fresh-evaluation
          path: outputs/crypto_hf_carry/evaluate_detailed
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
